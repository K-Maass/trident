# CIK pins that override SEC's ticker->CIK registry (data/fundamentals.py::cik_for).
# Only add an entry with evidence, and say what the evidence was.
#
# XOM (found 2026-07-21, ORACLE Phase 5): the registry maps ticker XOM to CIK 2115436,
# "EXXON MOBIL CORP" — a 2026 POSASR filing shell whose companyfacts JSON is 1.2 KB with
# ZERO us-gaap facts. The operating company is CIK 34088, "Exxon Mobil Corporation", which
# serves full facts. Left unpinned, XOM silently returns 0 fiscal years and drops out of
# ORACLE's screen without an error — the exact silent-failure class golden rule 8 forbids.
cik_overrides:
  XOM: 34088

# GICS sectors — ORACLE's compare_peers groups on this (doc 05). Static config rather than a
# derived field: EDGAR carries SIC, not GICS, and SIC would split these 40 names into groups of
# one. Peer groups here are small by construction (Energy and Industrials hold 2 names each), so
# compare_peers reports the peer count and never presents a 1-peer comparison as a sector median.
# Phase 7 expands the universe toward the S&P 100; extend this map in the same commit.
