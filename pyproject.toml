[project]
name = "trident"
version = "0.1.0"
description = "Three-agent paper trading fund: quant, sentiment, and LLM analyst vs SPY"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "alpaca-py>=0.30",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.14",
    "pandas-market-calendars>=4.4",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "pyarrow>=16.0",       # parquet engine for the market-bar cache (data/market.py)
    "feedparser>=6.0",     # RSS ingestion in the core data layer (data/news.py)
    "rapidfuzz>=3.9",      # fuzzy-title dedupe for news_items (doc 04)
]

[project.optional-dependencies]
quant = ["lightgbm>=4.3", "scikit-learn>=1.5", "ta>=0.11", "vectorbt>=0.26"]
sentiment = ["transformers>=4.42", "torch>=2.3", "praw>=7.7", "anthropic>=0.34"]
oracle = ["langgraph>=0.2", "langchain-anthropic>=0.2", "anthropic>=0.34", "edgartools>=2.20"]
dashboard = ["streamlit>=1.36", "plotly>=5.22"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "freezegun>=1.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs live external services (Postgres, broker); excluded in CI via -m 'not integration'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trident"]
